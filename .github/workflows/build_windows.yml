name: Build Windows

# Builds the desktop app for Windows on every push to the fork's default branch,
# uploads it as a workflow artifact, and publishes it as the "latest-windows-build"
# pre-release, which can be downloaded at a fixed address without a GitHub login.

on:
  push:
    branches: [claude/relaxed-gauss-ymscnb]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x86_64
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo output
        uses: Swatinem/rust-cache@v2

      - name: Cargo build
        run: cargo build --locked --package ruffle_desktop --release --features jpegxr
        env:
          # Link the C runtime statically, so the .exe runs without installing it.
          RUSTFLAGS: -Ctarget-feature=+crt-static

      - name: Package
        run: |
          mkdir package
          cp target/release/ruffle_desktop.exe package/ruffle.exe
          cp README.md package/README.md
          cp LICENSE.md package/LICENSE.md

      - uses: actions/upload-artifact@v7
        with:
          name: ruffle-windows-x86_64
          path: package/

      - name: Zip
        run: Compress-Archive -Path package/* -DestinationPath ruffle-windows-x86_64.zip

      - name: Publish release
        if: github.ref_name == 'claude/relaxed-gauss-ymscnb'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          subject=$(git log -1 --format=%s)
          gh release delete latest-windows-build --cleanup-tag --yes || true
          gh release create latest-windows-build ruffle-windows-x86_64.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest Windows build" \
            --notes "Built from commit $GITHUB_SHA (\"$subject\") by [this run]($RUN_URL). Unzip it and run ruffle.exe."
